---
# NGC API key. api_key is read by the Account controller, NGC_API_KEY by the NIM workloads.
# The label opendatahub.io/managed is required: without it the Account reports "api key secret not found".
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.account.apiKeySecretName }}
  namespace: {{ .Values.account.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    opendatahub.io/managed: "true"
type: Opaque
stringData:
  api_key: {{ required "ngc.apiKey is required (see ngc-api-key.example)" .Values.ngc.apiKey | quote }}
  NGC_API_KEY: {{ .Values.ngc.apiKey | quote }}
