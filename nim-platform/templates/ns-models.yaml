---
# Namespace that exposes the NIM models. Labels of a model namespace: RHOAI dashboard project and Kueue.
# Its LocalQueues come from rhoai-gitops (distributedWorkloads.localQueueNamespaces must list this namespace).
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    openshift.io/display-name: {{ .Values.namespace.displayName | quote }}
    openshift.io/description: {{ .Values.namespace.description | quote }}
  labels:
    opendatahub.io/dashboard: 'true'
    kueue.openshift.io/managed: 'true'
