---
# The NIM runtime Template reads NGC_API_KEY from the secret nvidia-nim-secrets of the namespace where the model runs.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.account.apiKeySecretName }}
  namespace: {{ .Values.namespace.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    opendatahub.io/managed: "true"
type: Opaque
stringData:
  api_key: {{ required "ngc.apiKey is required (see ngc-api-key.example)" .Values.ngc.apiKey | quote }}
  NGC_API_KEY: {{ .Values.ngc.apiKey | quote }}
