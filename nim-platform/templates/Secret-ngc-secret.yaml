---
# Image pull secret for nvcr.io. The NIM runtime Template names it ngc-secret. It is the same one that the Account controller
# generates (odh-nim-account-pull): registry nvcr.io, user $oauthtoken, password = NGC API key.
apiVersion: v1
kind: Secret
metadata:
  name: ngc-secret
  namespace: {{ .Values.namespace.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    opendatahub.io/managed: "true"
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ dict "auths" (dict "nvcr.io" (dict "username" "$oauthtoken" "password" .Values.ngc.apiKey "auth" (printf "$oauthtoken:%s" .Values.ngc.apiKey | b64enc))) | toJson | quote }}
