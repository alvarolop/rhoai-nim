---
# WHAT to deploy: one replica of the model on a GPU, using the ServingRuntime of the same name.
# The NIM downloads its own model, so there is no storage section.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace.name }}
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    security.opendatahub.io/enable-auth: {{ .Values.auth.enabled | quote }}
    openshift.io/display-name: {{ .Values.name }}
  labels:
    opendatahub.io/dashboard: "true"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: {{ .Values.modelFormat }}
      runtime: {{ .Values.name }}
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
    {{- with .Values.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
