---
# WHAT to deploy: one replica of the model on a GPU, using the ServingRuntime of the same name.
# The NIM downloads its own model, so there is no storage section.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace.name }}
  annotations:
    # "Standard" is the name of RawDeployment in OpenShift AI 3.x: the admission rewrites it, so writing it here avoids a permanent OutOfSync in Argo CD.
    serving.kserve.io/deploymentMode: Standard
    security.opendatahub.io/enable-auth: {{ .Values.auth.enabled | quote }}
    openshift.io/display-name: {{ .Values.name }}
    {{- if eq (include "nim-model.hasHardwareProfile" . | trim) "true" }}
    opendatahub.io/hardware-profile-name: {{ include "nim-model.hardwareProfileName" . | quote }}
    opendatahub.io/hardware-profile-namespace: {{ .Values.hardwareProfile.namespace | quote }}
    {{- end }}
  labels:
    opendatahub.io/dashboard: "true"
    {{- if ne (include "nim-model.hasHardwareProfile" . | trim) "true" }}
    kueue.x-k8s.io/queue-name: {{ include "nim-model.kueueLocalQueue" . | quote }}
    {{- end }}
    {{- with include "nim-model.kueuePriorityClass" . | trim }}
    kueue.x-k8s.io/priority-class: {{ . | quote }}
    {{- end }}
spec:
  predictor:
    {{- if eq (include "nim-model.useDra" . | trim) "true" }}
    resourceClaims:
      - name: {{ include "nim-model.draClaimName" . }}
        resourceClaimTemplateName: {{ include "nim-model.draClaimTemplateName" . }}
    {{- end }}
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: {{ .Values.modelFormat }}
      runtime: {{ .Values.name }}
      resources:
        {{- include "nim-model.resources" . | nindent 8 }}
    {{- with .Values.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
