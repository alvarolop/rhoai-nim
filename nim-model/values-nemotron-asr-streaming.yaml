# Nemotron 3.5 ASR Streaming 0.6B: speech to text for LIVE audio (streaming only). Used by the voice agent.
# For offline transcription there is another NIM (nemotron-transcribe), see docs/riva-based-inferencing.md.
name: nemotron-asr-streaming
modelFormat: nemotron-asr-streaming

image:
  repository: nvcr.io/nim/nvidia/nemotron-asr-streaming
  tag: "1.5"

env:
  # type=multi: multilingual model (40 locales, language detection with "auto"). type=en-US: English only.
  # The default profile uses batch_size=128 (32 and 512 exist too). Append it here to change it, for example
  # "name=nemotron-asr-streaming,type=multi,batch_size=32".
  - name: NIM_TAGS_SELECTOR
    value: "name=nemotron-asr-streaming,type=multi"
  # There is no prebuilt engine for the L4 (only L40S, H100, A100, GB10), so by default the NIM compiles an INT8 engine
  # on the first start, which ran out of memory. This is the prebuilt L40S profile (batch_size=32, multilingual): the L40S
  # and the L4 are both compute capability 8.9 and the NIM lists it as compatible. Find the ids with
  # `list-model-profiles` inside the container. Remove this variable to go back to the engine build.
  - name: NIM_MODEL_PROFILE
    value: "c64e666e9c9ab385639b7022d5d076da21f8c4d1309427390cad144e10b1647a"

cache:
  size: 20Gi

# The first start builds a TensorRT engine for the GPU, which peaks above the 16Gi default (OOMKilled, exit 137).
# The 8Gi shared memory volume counts against the limit too.
resources:
  requests:
    memory: 12Gi
  limits:
    memory: 24Gi
