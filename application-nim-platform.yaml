---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app: nim-platform
  name: nim-platform
  namespace: openshift-gitops
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  project: default
  source:
    repoURL: https://github.com/alvarolop/rhoai-nim.git
    targetRevision: main
    path: nim-platform
    helm:
      values: |
        namespace:
          name: "$NIM_NAMESPACE"

        # Dev-only: the key travels in the Application. Do not use this for production.
        ngc:
          apiKey: "$NGC_API_KEY"
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions: []
